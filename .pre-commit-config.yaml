# Instalar una vez por clon:  make hooks   (o: pre-commit install --install-hooks)
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^(backend|scripts)/
        args: [--fix]
      - id: ruff-format
        files: ^(backend|scripts)/

  - repo: local
    hooks:
      - id: validar-commit
        name: Convención de commits (Conventional Commits + historia)
        entry: python3 scripts/validar_commit.py
        language: system
        stages: [commit-msg]

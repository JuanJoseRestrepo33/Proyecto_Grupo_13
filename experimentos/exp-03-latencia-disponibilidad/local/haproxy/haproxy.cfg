global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option httplog
    option redispatch
    retries 3

frontend fe_cotizacion
    bind *:8080
    default_backend be_cotizacion

backend be_cotizacion
    option httpchk GET /health
    http-check expect status 200
    server zona-a zone-a:8000 check inter 2s fall 2 rise 2
    server zona-b zone-b:8000 check inter 2s fall 2 rise 2
    server zona-c zone-c:8000 check inter 2s fall 2 rise 2
    server zona-backup zone-backup:8000 check inter 2s fall 2 rise 2 backup

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

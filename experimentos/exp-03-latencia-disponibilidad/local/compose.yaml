version: "3.8"

networks:
  exp03:

volumes:
  primary-data:
  replica-data:

services:
  postgres-primary:
    image: docker.io/library/postgres:16
    networks: [exp03]
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: solventa
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./postgres-primary/pg_hba.conf:/etc/postgresql/custom_pg_hba.conf:ro
      - ./postgres-primary/init-replication.sql:/docker-entrypoint-initdb.d/init-replication.sql:ro
    command: >
      postgres
      -c hba_file=/etc/postgresql/custom_pg_hba.conf
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solventa"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-replica:
    image: docker.io/library/postgres:16
    networks: [exp03]
    depends_on: [postgres-primary]
    environment:
      PGPASSWORD: replicator_pw
      PGDATA: /var/lib/postgresql/data
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./postgres-replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]

  zone-a:
    build: ../servicio-cotizacion
    networks: [exp03]
    depends_on: [postgres-primary]
    environment:
      ZONE: zona-a
      DATABASE_URL: postgresql://solventa:solventa@postgres-primary:5432/solventa

  zone-b:
    build: ../servicio-cotizacion
    networks: [exp03]
    depends_on: [postgres-primary]
    environment:
      ZONE: zona-b
      DATABASE_URL: postgresql://solventa:solventa@postgres-primary:5432/solventa

  zone-c:
    build: ../servicio-cotizacion
    networks: [exp03]
    depends_on: [postgres-primary]
    environment:
      ZONE: zona-c
      DATABASE_URL: postgresql://solventa:solventa@postgres-primary:5432/solventa

  zone-backup:
    build: ../servicio-cotizacion
    networks: [exp03]
    depends_on: [postgres-replica]
    environment:
      ZONE: zona-backup-region
      DATABASE_URL: postgresql://solventa:solventa@postgres-replica:5432/solventa

  haproxy:
    image: docker.io/library/haproxy:2.9
    networks: [exp03]
    depends_on: [zone-a, zone-b, zone-c, zone-backup]
    ports:
      - "8080:8080"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

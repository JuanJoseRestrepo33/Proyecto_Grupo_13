[project]
name = "solventa-nucleo"
version = "0.1.0"
description = "Núcleo transaccional de Solventa: monolito modular con fachada versionada"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7.4",
    "import-linter>=2.1",
    "diff-cover>=9.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Lint y formato. Mismas reglas que scripts/ruff.toml para que el repo sea uno solo.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# N818 exige que toda excepción termine en "Error". El código del núcleo está en
# español y estos errores se leen como sustantivos del dominio, que es lo que son.
"app/compartido/errores.py" = ["N818"]

# ---------------------------------------------------------------------------
# Pruebas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
omit = ["app/main.py"]

# ---------------------------------------------------------------------------
# Frontera entre módulos (ARQ-01). El job `backend` del CI corre `lint-imports`.
#
# El monolito es modular porque estas reglas lo obligan, no porque lo diga un
# documento: si alguien las rompe, el pipeline falla.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# Necesario porque hay contratos que prohíben importar paquetes externos.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dentro de cotización: api → aplicación → dominio, nunca al revés"
type = "layers"
layers = [
    "app.modulos.cotizacion.api",
    "app.modulos.cotizacion.aplicacion",
    "app.modulos.cotizacion.dominio",
]

[[tool.importlinter.contracts]]
name = "La infraestructura depende del dominio, nunca al revés"
type = "layers"
layers = [
    "app.modulos.cotizacion.infraestructura",
    "app.modulos.cotizacion.dominio",
]

[[tool.importlinter.contracts]]
name = "El dominio no conoce frameworks web ni de persistencia"
type = "forbidden"
source_modules = ["app.modulos.cotizacion.dominio"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "El kernel compartido no depende de ningún módulo de negocio"
type = "forbidden"
source_modules = ["app.compartido"]
forbidden_modules = ["app.modulos", "app.fachada"]

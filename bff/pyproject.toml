[project]
name = "solventa-bff"
version = "0.1.0"
description = "Backend for Frontend de Solventa: un servicio con un router por canal (web y móvil)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7.4",
    "import-linter>=2.1",
    "diff-cover>=9.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Lint y formato. Mismas reglas que el núcleo para que el repo sea uno solo.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Los errores se leen como sustantivos del dominio, igual que en el núcleo.
"app/comun/errores.py" = ["N818"]
"app/comun/tokens.py" = ["N818"]

# ---------------------------------------------------------------------------
# Pruebas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
omit = ["app/main.py"]

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iniciar sesión · Solventa Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
<a class="skip-link" href="#screen-content">Saltar al contenido principal</a>
<div id="a11yAnnouncer" class="sr-only" role="status" aria-live="polite"></div>
<div class="device-stage">
<div class="device-frame">
<div class="app-shell">
  <div class="splash" id="screen-content" tabindex="-1">
    <div class="mark" aria-hidden="true">🛡️</div>
    <h1 data-i18n>Solventa</h1>
    <p data-i18n>Aseguradora digital de finanzas abiertas, en tu bolsillo.</p>
    <form onsubmit="return false" style="width:100%;max-width:280px;margin-top:12px;text-align:left">
      <div class="form-group">
        <label for="email" style="color:#fff" data-i18n>Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@correo.com">
      </div>
      <div class="form-group">
        <label for="pass" style="color:#fff" data-i18n>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <a class="btn btn-primary" href="index.html" style="background:#fff;color:var(--primary-700)" data-i18n>Iniciar sesión</a>
      <button class="btn btn-ghost" style="border-color:rgba(255,255,255,.5);color:#fff;margin-top:10px" data-i18n>👆 Ingresar con huella</button>
    </form>
  </div>
</div></div>
</div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

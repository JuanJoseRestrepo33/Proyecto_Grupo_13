<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iniciar sesión · Solventa Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
<a class="skip-link" href="#screen-content">Saltar al contenido principal</a>
<div id="a11yAnnouncer" class="sr-only" role="status" aria-live="polite"></div>
<div class="device-stage">
<div class="device-frame">
<div class="app-shell">
  <main class="splash" id="screen-content" tabindex="-1">
    <div class="mark" aria-hidden="true"><span class="brand-mark brand-mark-lg"></span></div>
    <h1 data-i18n>Solventa</h1>
    <p data-i18n>Aseguradora digital de finanzas abiertas, en tu bolsillo.</p>
    <form id="loginForm" novalidate style="width:100%;max-width:280px;margin-top:12px;text-align:left">
      <div class="form-group">
        <label for="email" style="color:#fff" data-i18n>Correo electrónico</label>
        <input type="email" id="email" autocomplete="username" placeholder="nombre@correo.com" value="juan.rodriguez@correo.com">
      </div>
      <div class="form-group">
        <label for="pass" style="color:#fff" data-i18n>Contraseña</label>
        <input type="password" id="pass" autocomplete="current-password" placeholder="••••••••" value="demo1234">
      </div>
      <p class="error-text" id="loginErr" hidden role="alert" style="color:#FEE2E2" data-i18n>Ingresa un correo válido y tu contraseña.</p>
      <button type="submit" class="btn btn-primary" style="background:#fff;color:var(--primary-700)" data-i18n>Iniciar sesión</button>
      <button type="button" id="bioLogin" class="btn btn-ghost" style="border-color:rgba(255,255,255,.5);color:#fff;margin-top:10px" data-i18n>👆 Ingresar con huella</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:#fff"><span data-i18n>¿Nuevo en Solventa?</span> <a href="onboarding.html" style="color:#fff;font-weight:700;text-decoration:underline" data-i18n>Crear cuenta</a></p>
    </form>
  </main>
</div></div>
</div>
<script src="assets/js/flow.js"></script>
<script src="assets/js/features.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

# Despliegue continuo (ARQ-04), según GitFlow:
#   push a develop → imagen :develop → environment "staging"
#   push a main    → imagen :main    → environment "produccion" (main solo recibe releases y hotfixes)
#
# El pipeline publica la imagen en el registro de GitHub, la copia a Artifact Registry y la despliega
# en Cloud Run. Se autentica ante Google Cloud con Workload Identity Federation: no existe ninguna
# llave de cuenta de servicio, ni en GitHub ni en el código. Las credenciales de bases de datos y
# demás configuración de infraestructura viven en Secret Manager, montadas sobre el servicio de Cloud
# Run, y el pipeline nunca las ve. Variables de cada environment: ver docs/devops.md, sección
# "Despliegue continuo".
name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVICIO: solventa-nucleo

jobs:
  publicar:
    name: Publicar imagen
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
      publicada: ${{ steps.nombre.outputs.publicada }}
    steps:
      - uses: actions/checkout@v4
      - id: nombre
        run: |
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICIO}" >> "$GITHUB_OUTPUT"
          if [ -f backend/Dockerfile ]; then
            echo "publicada=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicada=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no existe backend/Dockerfile; no hay imagen que publicar."
          fi
      - if: steps.nombre.outputs.publicada == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.nombre.outputs.publicada == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.nombre.outputs.publicada == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en ${{ github.ref_name == 'main' && 'produccion' || 'staging' }}
    needs: publicar
    if: needs.publicar.outputs.publicada == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'staging' }}
    permissions:
      contents: read
      packages: read
      id-token: write # para obtener el token de Workload Identity Federation
    env:
      PROYECTO: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      PROVEEDOR_IDENTIDAD: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      CUENTA_SERVICIO: ${{ vars.GCP_SERVICE_ACCOUNT }}
      REPOSITORIO: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICIO_CLOUD_RUN: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGEN_GITHUB: ${{ needs.publicar.outputs.imagen }}:${{ github.sha }}
    steps:
      - name: Verificar configuración
        id: config
        run: |
          faltan=""
          for variable in PROYECTO REGION PROVEEDOR_IDENTIDAD CUENTA_SERVICIO REPOSITORIO SERVICIO_CLOUD_RUN; do
            [ -z "${!variable}" ] && faltan="$faltan $variable"
          done
          if [ -n "$faltan" ]; then
            echo "::notice::El environment no tiene configurado el despliegue (faltan:$faltan); se omite."
            echo "lista=false" >> "$GITHUB_OUTPUT"
          else
            echo "lista=true" >> "$GITHUB_OUTPUT"
            echo "imagen=${REGION}-docker.pkg.dev/${PROYECTO}/${REPOSITORIO}/${SERVICIO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Autenticar en Google Cloud
        if: steps.config.outputs.lista == 'true'
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVEEDOR_IDENTIDAD }}
          service_account: ${{ env.CUENTA_SERVICIO }}
          token_format: access_token
      - if: steps.config.outputs.lista == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.config.outputs.lista == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.config.outputs.lista == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - name: Copiar la imagen a Artifact Registry
        if: steps.config.outputs.lista == 'true'
        env:
          IMAGEN_GCP: ${{ steps.config.outputs.imagen }}
        # Copia el manifiesto y las capas ya construidas; no vuelve a construir, así lo que se
        # despliega es exactamente lo que el CI probó.
        run: docker buildx imagetools create --tag "$IMAGEN_GCP" "$IMAGEN_GITHUB"
      - name: Desplegar en Cloud Run
        if: steps.config.outputs.lista == 'true'
        id: despliegue
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICIO_CLOUD_RUN }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROYECTO }}
          image: ${{ steps.config.outputs.imagen }}
          # Las variables de entorno y los secretos del servicio se conservan entre despliegues;
          # se configuran una vez en la plataforma (docs/devops.md, "Configuración manual en GCP").
          flags: --allow-unauthenticated
      - name: Prueba de humo
        if: steps.config.outputs.lista == 'true'
        env:
          URL_AMBIENTE: ${{ steps.despliegue.outputs.url }}
        run: |
          for _ in $(seq 1 10); do
            if curl -sf -o /dev/null "$URL_AMBIENTE/v1/"; then echo "El ambiente responde"; exit 0; fi
            sleep 6
          done
          echo "::error::El ambiente no respondió tras el despliegue"
          exit 1

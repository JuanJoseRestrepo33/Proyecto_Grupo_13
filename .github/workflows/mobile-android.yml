name: Mobile Android

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'contratos/bff-movil/**'
      - 'bff/app/movil/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main, develop, 'release/**']
    paths:
      - 'mobile/android/**'
      - 'contratos/bff-movil/**'
      - 'bff/app/movil/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · lint, test, assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Validar contrato del BFF móvil
        working-directory: contratos/bff-movil
        run: npx --yes @redocly/cli@2.62.1 lint --config redocly.yaml openapi.yaml
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma y herramientas Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Validar wrapper y configurar cache Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint
        run: ./gradlew --no-daemon detekt lintDebug
      - name: BFF simulado con Mockoon · prueba de humo
        run: mockoon/mockoon.sh prueba
      - name: Levantar el BFF simulado para las pruebas del cliente
        run: |
          MOCKOON_TTL_ACCESO=2 nohup mockoon/mockoon.sh > "$RUNNER_TEMP/mockoon.log" 2>&1 &
          for _ in $(seq 60); do
            curl -s -o /dev/null http://localhost:3001/api/v1/movil/sesion && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/mockoon.log"; exit 1
      - name: Test
        env:
          # ContraMockoonTest: el cliente renueva solo un token vencido contra el BFF simulado.
          MOCKOON_URL: http://localhost:3001/api/v1/movil/
        run: >-
          ./gradlew --no-daemon :core:network:test :core:designsystem:testDebugUnitTest
          :feature:onboarding:testDebugUnitTest :feature:consentimiento:testDebugUnitTest
          :feature:siniestros:testDebugUnitTest
          :app:testDebugUnitTest :koverXmlReport :koverVerify
      - name: Publicar cobertura en el resumen del pipeline
        if: always()
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as E

          print("## Cobertura de Android")
          report = pathlib.Path("build/reports/kover/report.xml")
          if not report.is_file():
              print("Reporte Kover no disponible; revisar el paso Test.")
          else:
              root = E.parse(report).getroot()
              counter = root.find("./counter[@type='LINE']")
              if counter is None:
                  raise SystemExit("El XML de Kover no contiene el contador total LINE")
              covered = int(counter.get("covered"))
              missed = int(counter.get("missed"))
              total = covered + missed
              percentage = 100 * covered / total if total else 0
              print(f"**Total:** {percentage:.1f}% de líneas ({covered}/{total}). Mínimo: 70%.")
          PYTHON
      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verificar que el modo real exige la URL del ambiente
        run: |
          if ./gradlew --no-daemon --quiet :app:help -PBFF_MOCK=false > modo-real.log 2>&1; then
            echo "BFF_MOCK=false con el host .invalid debía fallar" >&2
            exit 1
          fi
          grep -q "BFF_MOCK=false necesita la URL del ambiente" modo-real.log
      - name: Resumen
        if: always()
        env:
          RESULTADO: ${{ job.status }}
        run: |
          echo "Android: $RESULTADO. Reportes de lint, Detekt y JUnit en los artefactos." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-mobile-android
          path: |
            mobile/android/build/reports/kover/report.xml
            mobile/android/**/build/reports/
            mobile/android/**/build/test-results/
          if-no-files-found: ignore
      - name: Publicar APK debug
        uses: actions/upload-artifact@v6
        with:
          name: solventa-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  apk-staging:
    # La app que se instala en un celular para probarla contra la nube (MOB-F02, #161): habla con el
    # router móvil del BFF de staging, no con el mock. Solo en develop, porque la URL es una variable
    # del environment staging.
    name: Android · APK contra staging
    needs: android
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: mobile/android
    env:
      BFF_BASE_URL: ${{ vars.BFF_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar la URL del ambiente
        run: |
          if [ -z "$BFF_BASE_URL" ]; then
            echo "::error::El environment staging no tiene la variable BFF_BASE_URL."
            exit 1
          fi
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma y herramientas Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true
      - name: Assemble debug contra staging
        run: ./gradlew --no-daemon :app:assembleDebug -PBFF_MOCK=false -PBFF_BASE_URL="$BFF_BASE_URL"
      - name: Resumen
        run: |
          {
            echo "## APK contra staging"
            echo "Habla con \`$BFF_BASE_URL\`. Descárgalo en **Artifacts → solventa-staging**, descomprímelo"
            echo "e instálalo en un Android 8 o superior (permitir apps de origen desconocido)."
            echo "Staging debe estar encendido para que la app funcione."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar APK contra staging
        uses: actions/upload-artifact@v6
        with:
          name: solventa-staging
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  e2e-emulador:
    # Pruebas instrumentadas contra staging (WEB-F05, #172; WEB-F06, #202). A mano, porque necesitan
    # Cloud SQL encendida, y solo en develop, la rama que admite el environment staging. Un fork no puede lanzarlo.
    name: Android · E2E en emulador contra staging
    needs: android
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    # Mismo grupo que el E2E web de cd.yml: los dos cambian el estado de la cuenta de prueba.
    concurrency:
      group: e2e-cuenta-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mobile/android
    env:
      BFF_BASE_URL: ${{ vars.BFF_BASE_URL }}
      E2E_CORREO: ${{ secrets.HUMO_CORREO }}
      E2E_CLAVE: ${{ secrets.HUMO_CLAVE }}
      # SeguimientoE2eTest (WEB-F06, #202) cambia el estado del caso con la operación interna del núcleo.
      # Mismos nombres que el E2E web de seguimiento (#201).
      NUCLEO_URL: ${{ vars.NUCLEO_URL }}
      E2E_TOKEN_INTERNO: ${{ secrets.SINIESTROS_TOKEN_INTERNO }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar la configuración del ambiente
        # Nombra cada variable o secreto ausente: ninguna prueba se omite en silencio por falta de uno.
        run: |
          faltan=0
          for par in "la variable BFF_BASE_URL:$BFF_BASE_URL" "el secreto HUMO_CORREO:$E2E_CORREO" \
                     "el secreto HUMO_CLAVE:$E2E_CLAVE" "la variable NUCLEO_URL:$NUCLEO_URL" \
                     "el secreto SINIESTROS_TOKEN_INTERNO:$E2E_TOKEN_INTERNO"; do
            if [ -z "${par#*:}" ]; then
              echo "::error::Falta ${par%%:*} en el environment staging."
              faltan=1
            fi
          done
          exit "$faltan"
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma y herramientas Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Sin artefactos: el enmascarado de GitHub cubre los logs, no los archivos, y los resultados del
      # runner podrían incluir los argumentos de instrumentación, entre ellos la clave.
      - name: Pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: mobile/android
          # Cámara trasera emulada: la prueba de evidencia toma una foto con CameraX (#179).
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
            -camera-back emulated
          disable-animations: true
          # ReporteSinConexionE2eTest (#213) usa el modo avión y lo desactiva en @Before y @After. Si la
          # instrumentación muere a mitad, la red se restaura aquí, antes de que el runner apague el
          # emulador. La acción corre cada línea del script por separado.
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -PBFF_MOCK=false -PBFF_BASE_URL="$BFF_BASE_URL" -Pandroid.testInstrumentationRunnerArguments.correo="$E2E_CORREO" -Pandroid.testInstrumentationRunnerArguments.clave="$E2E_CLAVE" -Pandroid.testInstrumentationRunnerArguments.nucleo="$NUCLEO_URL" -Pandroid.testInstrumentationRunnerArguments.tokenInterno="$E2E_TOKEN_INTERNO" || { adb shell cmd connectivity airplane-mode disable; exit 1; }
            adb shell cmd connectivity airplane-mode disable
      - name: Restaurar la red del emulador
        # Por si el paso anterior se canceló o venció con el emulador aún encendido. Si ya se apagó, no
        # queda red que restaurar y el paso no falla.
        if: always()
        run: adb shell cmd connectivity airplane-mode disable || echo "Sin emulador encendido; nada que restaurar."

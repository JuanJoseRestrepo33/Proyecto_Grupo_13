name: Mobile Android

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'contratos/bff-movil/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main, develop, 'release/**']
    paths:
      - 'mobile/android/**'
      - 'contratos/bff-movil/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · lint, test, assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Validar contrato del BFF móvil
        working-directory: contratos/bff-movil
        run: npx --yes @redocly/cli@2.62.1 lint --config redocly.yaml openapi.yaml
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma y herramientas Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Validar wrapper y configurar cache Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint
        run: ./gradlew --no-daemon detekt lintDebug
      - name: Test
        run: >-
          ./gradlew --no-daemon :core:network:test :core:designsystem:testDebugUnitTest
          :feature:onboarding:testDebugUnitTest :feature:consentimiento:testDebugUnitTest
          :app:testDebugUnitTest :koverXmlReport :koverVerify
      - name: Publicar cobertura en el resumen del pipeline
        if: always()
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as E

          print("## Cobertura de Android")
          report = pathlib.Path("build/reports/kover/report.xml")
          if not report.is_file():
              print("Reporte Kover no disponible; revisar el paso Test.")
          else:
              root = E.parse(report).getroot()
              counter = root.find("./counter[@type='LINE']")
              if counter is None:
                  raise SystemExit("El XML de Kover no contiene el contador total LINE")
              covered = int(counter.get("covered"))
              missed = int(counter.get("missed"))
              total = covered + missed
              percentage = 100 * covered / total if total else 0
              print(f"**Total:** {percentage:.1f}% de líneas ({covered}/{total}). Mínimo: 70%.")
          PYTHON
      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Resumen
        if: always()
        env:
          RESULTADO: ${{ job.status }}
        run: |
          echo "Android: $RESULTADO. Reportes de lint, Detekt y JUnit en los artefactos." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-mobile-android
          path: |
            mobile/android/build/reports/kover/report.xml
            mobile/android/**/build/reports/
            mobile/android/**/build/test-results/
          if-no-files-found: ignore
      - name: Publicar APK debug
        uses: actions/upload-artifact@v6
        with:
          name: solventa-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

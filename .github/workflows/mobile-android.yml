name: Mobile Android

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main, develop, 'release/**']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · lint, test, assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma y herramientas Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Validar wrapper y configurar cache Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint
        run: ./gradlew --no-daemon detekt lintDebug
      - name: Test
        run: ./gradlew --no-daemon :core:network:test :app:testDebugUnitTest
      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Resumen
        if: always()
        env:
          RESULTADO: ${{ job.status }}
        run: |
          echo "Android: $RESULTADO. Reportes de lint, Detekt y JUnit en los artefactos." >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-mobile-android
          path: |
            mobile/android/**/build/reports/
            mobile/android/**/build/test-results/
          if-no-files-found: ignore
      - name: Publicar APK debug
        uses: actions/upload-artifact@v6
        with:
          name: solventa-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

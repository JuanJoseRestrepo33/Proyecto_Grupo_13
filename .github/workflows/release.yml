# Release (GitFlow): al fusionar en main un PR desde release/vX.Y.Z o hotfix/vX.Y.Z,
#   1. crea el tag vX.Y.Z sobre el commit de merge y el release con notas generadas desde los PR,
#   2. publica las imágenes del núcleo, el BFF y la web etiquetadas con la versión (las que existan),
#   3. abre el PR de back-merge main → develop para que develop reciba los cambios del release.
# Requiere: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Secreto opcional RELEASE_TOKEN (token de un integrante con permiso de PR): sin él, el PR de
# back-merge se crea igual, pero GitHub no le dispara el CI y hay que cerrarlo y reabrirlo a mano.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RAMA: ${{ github.head_ref }}
      COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Versión
        id: version
        run: echo "tag=${RAMA#*/}" >> "$GITHUB_OUTPUT"
      - name: Crear tag y release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$COMMIT" --title "$TAG" --generate-notes
      - name: Publicar imágenes versionadas
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TAG: ${{ steps.version.outputs.tag }}
        # Las mismas tres imágenes que despliega cd.yml; se omite la que aún no tiene Dockerfile.
        run: |
          for par in solventa-nucleo:backend solventa-bff:bff solventa-web:apps/web; do
            servicio="${par%%:*}" contexto="${par#*:}"
            [ -f "$contexto/Dockerfile" ] || { echo "::notice::Sin $contexto/Dockerfile; se omite $servicio."; continue; }
            imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$servicio"
            docker build -t "$imagen:${TAG#v}" "$contexto"
            docker push "$imagen:${TAG#v}"
          done
      - name: Abrir back-merge main → develop
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base develop --head main \
            --title "chore(release): $TAG integrar main en develop" \
            --body "Back-merge automático tras publicar $TAG. Fusionar con **merge commit** (no squash)."

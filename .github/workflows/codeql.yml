# Revisión automática de código: análisis estático de seguridad y calidad con CodeQL.
# Los hallazgos aparecen en Security → Code scanning y como anotaciones en el PR.
# Al agregar web/móvil con código JavaScript/TypeScript, se suma "javascript-typescript".
name: CodeQL

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    name: Analizar (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.lenguaje }}

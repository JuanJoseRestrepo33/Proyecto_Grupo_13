# Integración continua (ARQ-04): corre en cada pull request hacia develop, main o release/* y en
# cada push a develop o main. El check "ci-ok" es el que la protección de ramas exige en verde.
#
# Los jobs de backend se activan solos cuando exista backend/pyproject.toml (ARQ-01), y el de la
# app web cuando exista apps/web/package.json.
# Contrato que deben cumplir: ver docs/devops.md, sección "Integración continua".
name: CI

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detectar:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.componentes.outputs.backend }}
      web: ${{ steps.componentes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: componentes
        run: |
          if [ -f backend/pyproject.toml ]; then echo "backend=true"; else echo "backend=false"; fi >> "$GITHUB_OUTPUT"
          if [ -f apps/web/package.json ]; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"

  convenciones:
    name: GitFlow, convención de commits y título del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flujo GitFlow (rama origen → rama destino)
        env:
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: python scripts/validar_rama.py --origen "$ORIGEN" --destino "$DESTINO"
      - name: Título del PR (es el mensaje del squash merge)
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: python scripts/validar_commit.py --mensaje "$TITULO"
      - name: Commits del PR
        run: python scripts/validar_commit.py --rango "origin/${{ github.base_ref }}..HEAD"

  herramientas:
    name: Herramientas del repo · lint y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov ruff
      - name: Lint (ruff)
        run: ruff check --output-format=github . && ruff format --check .
      - name: Pruebas
        run: pytest -q --cov=. --cov-report=term-missing --junitxml=reporte-pruebas.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-herramientas
          path: scripts/reporte-pruebas.xml
          if-no-files-found: ignore

  backend:
    name: Backend · lint, módulos, pruebas y cobertura
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Formato (ruff format)
        run: ruff format --check .
      - name: Frontera entre módulos (import-linter)
        run: lint-imports
      - name: Pruebas unitarias con cobertura
        run: pytest --cov=app --cov-report=xml --junitxml=reporte-pruebas.xml
      - name: Cobertura del código nuevo ≥ 70%
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=70 \
            --markdown-report cobertura-nueva.md
      - name: Publicar cobertura en el resumen del pipeline
        if: always()
        run: |
          {
            echo "## Cobertura del backend"
            python -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot(); print(f\"**Total:** {float(r.get('line-rate'))*100:.1f}% de líneas\")" || true
            if [ -f cobertura-nueva.md ]; then cat cobertura-nueva.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: |
            backend/coverage.xml
            backend/reporte-pruebas.xml
            backend/cobertura-nueva.md
          if-no-files-found: ignore

  web:
    name: Web · contrato, lint, tipos, pruebas, cobertura y build
    needs: detectar
    if: needs.detectar.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Contrato del BFF válido (OpenAPI)
        run: npm run contratos:validar
      - name: Tipos del contrato al día
        run: |
          npm run contratos:tipos
          git diff --exit-code src/api/esquema.ts \
            || { echo "::error::src/api/esquema.ts no coincide con el contrato. Ejecuta 'npm run contratos:tipos' y haz commit."; exit 1; }
      - name: Lint (ESLint + accesibilidad)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas con cobertura (mínimo 70%)
        run: npm run test:cobertura -- --reporter=default --reporter=junit --outputFile.junit=reporte-pruebas.xml
      - name: Cobertura del código nuevo ≥ 70%
        if: github.event_name == 'pull_request'
        run: |
          pip install -q diff-cover
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=70 \
            --markdown-report cobertura-nueva.md
      - name: Publicar cobertura en el resumen del pipeline
        if: always()
        run: |
          {
            echo "## Cobertura de la app web"
            python3 -c "import xml.etree.ElementTree as E; r=E.parse('coverage/cobertura-coverage.xml').getroot(); print(f\"**Total:** {float(r.get('line-rate'))*100:.1f}% de líneas\")" || true
            if [ -f cobertura-nueva.md ]; then cat cobertura-nueva.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build de producción
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-web
          path: |
            apps/web/coverage/cobertura-coverage.xml
            apps/web/reporte-pruebas.xml
            apps/web/cobertura-nueva.md
          if-no-files-found: ignore

  imagen:
    name: Imagen Docker
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen del núcleo
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: ci-ok
    if: always()
    needs: [detectar, convenciones, herramientas, backend, web, imagen]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los checks requeridos pasaron
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          resultados = json.loads(os.environ["RESULTADOS"])
          fallidos = [n for n, j in resultados.items() if j["result"] not in ("success", "skipped")]
          print("Fallaron:", fallidos) if fallidos else print("Todo en verde")
          sys.exit(1 if fallidos else 0)
          EOF

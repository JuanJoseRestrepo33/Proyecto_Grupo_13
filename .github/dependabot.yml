# Actualizaciones automáticas de dependencias. Al crear backend/ (ARQ-01) se agregan aquí
# los ecosistemas pip y docker con directory: /backend.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups:
      dependencias-web:
        patterns: ["*"]
        update-types: [minor, patch]

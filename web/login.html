<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Solventa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
<a class="skip-link" href="#main-content">Saltar al contenido principal</a>
<div id="a11yAnnouncer" class="sr-only" role="status" aria-live="polite"></div>
<div class="auth-wrap" id="main-content" tabindex="-1">
  <div class="auth-card">
    <div class="auth-logo"><span style="font-size:26px" aria-hidden="true">🛡️</span> Solventa</div>
    <p class="text-muted text-sm" style="text-align:center;margin-bottom:24px" data-i18n>Aseguradora digital de finanzas abiertas</p>
    <form onsubmit="return false" action="index.html">
      <div class="form-group">
        <label for="email" data-i18n>Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@correo.com" required>
      </div>
      <div class="form-group">
        <label for="pass" data-i18n>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••" required>
      </div>
      <a class="btn btn-primary btn-block" href="index.html" style="margin-top:8px" data-i18n>Iniciar sesión</a>
      <p class="text-sm text-muted" style="text-align:center;margin-top:16px">
        <span data-i18n>¿Nuevo en Solventa?</span> <a href="cotizacion.html" style="color:var(--primary-700);font-weight:600" data-i18n>Cotiza tu primer seguro</a>
      </p>
    </form>
  </div>
</div><script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

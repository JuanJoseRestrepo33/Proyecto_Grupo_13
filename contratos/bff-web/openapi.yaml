openapi: 3.1.0
info:
  title: Solventa · BFF Web
  version: 0.8.0
  description: |
    Contrato entre el cliente web y su Backend for Frontend (BFF).

    El cliente web solo habla con este BFF; el BFF orquesta el núcleo. Mientras el BFF no exista,
    el cliente web trabaja contra mocks que implementan este mismo contrato
    (`apps/web/src/mocks`). Cubre:

    - **WEB-F02** · Gestión del consentimiento Open Finance.
    - **WEB-F01** · Asistente de cotización con tarifa personalizada o estándar,
      explicación del precio y vigencia de la oferta.
    - **WEB-F03** (rebanada) · Checkout: aceptar la oferta y pagarla contra la pasarela
      simulada, sin cobro doble. La firma y la emisión llegan con el resto de WEB-F03.
    - **WEB-F13** · Inicio y cierre de sesión con la misma cuenta del registro en la app.
    - **WEB-F05** · Reporte de siniestros en tres pasos, idempotente, igual que en la app.
    - **MOB-F05** · Evidencia del siniestro: adjuntar, listar y descargar, igual que en la app.

    Convenciones: nombres en español y `snake_case`; montos enteros en la unidad mayor de la moneda,
    sin decimales (pesos para COP: `132900` = $132.900); fechas en ISO 8601 con zona horaria.
  license:
    name: Uso académico · MISW4501
    identifier: LicenseRef-Academico
servers:
  - url: /api/v1/web
    description: Prefijo del BFF web (relativo al dominio de la aplicación)
security:
  - sesion: []
tags:
  - name: sesion
    description: Cliente autenticado en el canal web
  - name: consentimientos
    description: Consentimiento de Open Finance (WEB-F02)
  - name: cotizaciones
    description: Asistente de cotización (WEB-F01)
  - name: suscripciones
    description: Checkout de la oferta aceptada (WEB-F03)
  - name: siniestros
    description: Reporte de siniestros (WEB-F05)

paths:
  /sesion:
    get:
      tags: [sesion]
      operationId: obtenerSesion
      summary: Cliente autenticado
      responses:
        "200":
          description: Sesión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [sesion]
      operationId: iniciarSesion
      summary: Inicia sesión con correo y contraseña
      description: |
        Es la misma cuenta del registro en la app (WEB-F13, criterio 1). La respuesta pone la
        cookie `sesion` (`HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/api/v1/web`); la web nunca
        ve el token. La cookie dura lo mismo que la sesión: al vencer, las rutas protegidas
        responden 401 `sesion_no_vigente` y la web vuelve al inicio de sesión. En la web no hay
        renovación.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credenciales" }
      responses:
        "200":
          description: Sesión abierta
          headers:
            Set-Cookie:
              description: Cookie `sesion` con el token de la sesión
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401":
          description: |
            Correo o contraseña incorrectos (`credenciales_invalidas`). La respuesta es la misma
            exista o no el correo, para no revelar qué cuentas existen (WEB-F13, criterio 3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }
    delete:
      tags: [sesion]
      operationId: cerrarSesion
      summary: Cierra la sesión
      description: |
        Borra la cookie `sesion`. No exige sesión: responde 204 aunque la cookie esté vencida, no
        sea válida o no exista, para que la web siempre pueda cerrarla.
      security: []
      responses:
        "204":
          description: Sesión cerrada
          headers:
            Set-Cookie:
              description: Cookie `sesion` vencida, para que el navegador la borre
              schema: { type: string }

  /consentimientos/finalidades:
    get:
      tags: [consentimientos]
      operationId: listarFinalidades
      summary: Finalidades que el cliente puede autorizar, cada una por separado
      description: |
        Cada finalidad trae su alcance, su vigencia y las entidades origen de los datos, y la
        versión del texto legal que el cliente acepta al otorgarla (WEB-F02, criterios 1 y 6).
      responses:
        "200":
          description: Catálogo de finalidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finalidad" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /consentimientos:
    get:
      tags: [consentimientos]
      operationId: listarConsentimientos
      summary: Consentimientos del cliente, en cualquier estado
      responses:
        "200":
          description: Consentimientos del cliente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [consentimientos]
      operationId: otorgarConsentimiento
      summary: Otorga el consentimiento para una finalidad
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudConsentimiento" }
      responses:
        "201":
          description: Consentimiento otorgado y vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /consentimientos/{id}/revocacion:
    post:
      tags: [consentimientos]
      operationId: revocarConsentimiento
      summary: Revoca un consentimiento vigente
      description: |
        El estado cambia a `revocado` de inmediato. La propagación al resto de la plataforma
        ocurre en ≤ 5 minutos (RC-04); desde ese momento las cotizaciones usan tarifa estándar.
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Consentimiento revocado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /consentimientos/{id}/renovacion:
    post:
      tags: [consentimientos]
      operationId: renovarConsentimiento
      summary: Renueva un consentimiento vigente o vencido sin repetir el flujo completo
      description: |
        La nueva vigencia se cuenta desde la renovación. 409 si está revocado, o si está vencido y ya
        hay otro vigente para la misma finalidad.
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Consentimiento renovado con nueva fecha de expiración
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /consentimientos/{id}/eventos:
    get:
      tags: [consentimientos]
      operationId: listarEventosConsentimiento
      summary: Histórico del consentimiento en orden cronológico
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Eventos del consentimiento, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventoConsentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /cotizaciones/productos:
    get:
      tags: [cotizaciones]
      operationId: listarProductos
      summary: Productos que se pueden cotizar
      responses:
        "200":
          description: Catálogo de productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Producto" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /cotizaciones:
    post:
      tags: [cotizaciones]
      operationId: crearCotizacion
      summary: Cotiza un producto
      description: |
        Con consentimiento vigente para la finalidad `cotizacion` y `usar_open_finance` en `true`,
        la prima es `personalizada`. En otro caso es `estandar` y `motivo_tarifa` explica por qué.
        No es un error. La oferta vale 5 minutos (`vigente_hasta`); después hay que recotizar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudCotizacion" }
      responses:
        "201":
          description: Cotización emitida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cotizacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /cotizaciones/{id}:
    get:
      tags: [cotizaciones]
      operationId: obtenerCotizacion
      summary: Consulta una cotización emitida
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cotización, incluida su vigencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cotizacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /cotizaciones/{id}/recotizacion:
    post:
      tags: [cotizaciones]
      operationId: recotizar
      summary: Recotiza con los mismos datos de una cotización vencida
      description: Crea una cotización nueva; la anterior no cambia.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Cotización nueva, vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cotizacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /suscripciones:
    post:
      tags: [suscripciones]
      operationId: crearSuscripcion
      summary: Acepta una cotización vigente
      description: |
        Crea la suscripción en estado `aceptada` con las condiciones de la cotización. Es
        idempotente por cotización: aceptar de nuevo la misma devuelve la suscripción existente
        con 200, no crea otra. Una cotización vencida se rechaza con `cotizacion_vencida`; la
        interfaz ofrece recotizar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudSuscripcion" }
      responses:
        "200":
          description: La cotización ya estaba aceptada; es la misma suscripción
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suscripcion" }
        "201":
          description: Suscripción creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suscripcion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: "`cotizacion_vencida`: pasó la vigencia de la oferta"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /suscripciones/{id}:
    get:
      tags: [suscripciones]
      operationId: obtenerSuscripcion
      summary: Consulta una suscripción y su último pago
      parameters:
        - $ref: "#/components/parameters/IdSuscripcion"
      responses:
        "200":
          description: Suscripción
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suscripcion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /suscripciones/{id}/pagos:
    post:
      tags: [suscripciones]
      operationId: pagarSuscripcion
      summary: Paga la suscripción contra la pasarela simulada
      description: |
        Cada intento de pago lleva su `Idempotency-Key`, generada por el cliente. Repetir la
        solicitud con la **misma** clave nunca cobra dos veces (P18):

        - Si el primer intento ya terminó, responde 200 con el mismo pago y `reintento: true`.
        - Si el primer intento sigue en curso, responde 409 `pago_en_curso`.

        Un intento nuevo (otra clave) solo procede si no hay un pago aprobado ni pendiente; si lo
        hay, responde 409 `pago_ya_registrado`. Tras un pago rechazado, el cliente usa una clave
        nueva para intentar otra vez.

        El cliente no envía datos de la tarjeta ni de la cuenta: los toma la pasarela.
      parameters:
        - $ref: "#/components/parameters/IdSuscripcion"
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador único del intento de pago (UUID v4)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudPago" }
      responses:
        "200":
          description: Reintento de un pago ya procesado con la misma clave; no hubo otro cobro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pago" }
        "201":
          description: Pago procesado por la pasarela (aprobado, rechazado o pendiente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pago" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: "`pago_en_curso` o `pago_ya_registrado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /suscripciones/{id}/pagos/{id_pago}:
    get:
      tags: [suscripciones]
      operationId: obtenerPago
      summary: Consulta el estado de un pago, por ejemplo uno pendiente
      parameters:
        - $ref: "#/components/parameters/IdSuscripcion"
        - name: id_pago
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pago con su estado actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pago" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /polizas:
    get:
      tags: [siniestros]
      operationId: listarPolizas
      summary: Pólizas del cliente, para elegir la afectada en el reporte de siniestro
      description: |
        Resumen de cada póliza con su vigencia y estado. La consulta completa, con coberturas,
        deducibles y documento, llega con WEB-F04 y amplía esta misma respuesta.
      responses:
        "200":
          description: Pólizas del cliente, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolizaResumen" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /siniestros:
    get:
      tags: [siniestros]
      operationId: listarSiniestros
      summary: Siniestros del cliente, reportados desde cualquier canal
      responses:
        "200":
          description: Siniestros del cliente, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [siniestros]
      operationId: reportarSiniestro
      summary: Reporta un siniestro sobre una póliza del cliente
      description: |
        El siniestro queda `reportado`, con un número de referencia y el siguiente paso del caso,
        y se ve igual desde la web y desde la app (WEB-F05, criterio 1).

        Cada envío del asistente lleva su `Idempotency-Key`, generada por el cliente. Repetirlo con
        la **misma** clave (doble clic, reintento por red lenta) responde 200 con el mismo
        siniestro y la misma referencia: no se crea otro (criterio 4, P10, P18).

        Una póliza vencida admite el reporte si el evento ocurrió dentro de su vigencia; si no,
        responde 409 `evento_fuera_de_vigencia` con las fechas de la póliza y no queda registro
        (criterio 3).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador único del envío del reporte (UUID v4)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudSiniestro" }
      responses:
        "200":
          description: Reintento de un reporte ya hecho con la misma clave; no se creó otro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "201":
          description: Siniestro reportado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404":
          description: La póliza no existe o no es del cliente (`poliza_no_encontrada`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `evento_fuera_de_vigencia` (trae `vigente_desde` y `vigente_hasta`) o
            `clave_idempotencia_en_uso` (la clave ya se usó para un reporte con otros datos).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorVigencia" }
        "422":
          description: |
            Datos inválidos, `fecha_futura` sobre `ocurrido_el` o `clave_idempotencia_invalida`
            (falta la clave o no es un UUID). Un error por campo en `campos`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /siniestros/{id}:
    get:
      tags: [siniestros]
      operationId: obtenerSiniestro
      summary: Detalle de un siniestro
      parameters:
        - $ref: "#/components/parameters/IdSiniestro"
      responses:
        "200":
          description: Siniestro con su estado y siguiente paso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /siniestros/{id}/evidencias:
    get:
      tags: [siniestros]
      operationId: listarEvidencias
      summary: Evidencias del siniestro, cargadas desde cualquier canal
      parameters:
        - $ref: "#/components/parameters/IdSiniestro"
      responses:
        "200":
          description: Evidencias en el orden en que se cargaron
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evidencia" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    post:
      tags: [siniestros]
      operationId: adjuntarEvidencia
      summary: Adjunta una foto, un video o un documento al siniestro
      description: |
        Se puede agregar en el reporte o después; queda asociada al mismo siniestro y se ve en los
        dos canales (MOB-F05, criterio 5). Hasta 10 MB, y solo JPEG, PNG, HEIC, MP4 o PDF: el
        formato se comprueba con el contenido del archivo, no solo con su extensión.

        La fecha y hora de la cámara y la ubicación son opcionales. Si el cliente negó el permiso
        de ubicación puede escribir el `lugar`; el reporte nunca queda bloqueado por un permiso
        (criterios 1 y 2, P20).
      parameters:
        - $ref: "#/components/parameters/IdSiniestro"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SolicitudEvidencia" }
      responses:
        "201":
          description: Evidencia guardada y asociada al siniestro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidencia" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El siniestro está cerrado y ya no recibe evidencia (`siniestro_cerrado`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: El archivo supera los 10 MB (`archivo_demasiado_grande`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `formato_no_admitido` o `archivo_vacio` sobre `archivo`; `ubicacion_invalida` o
            `fecha_de_captura_invalida`. Un error por campo en `campos`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: El almacén de evidencias no respondió (`almacenamiento_no_disponible`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /siniestros/{id}/evidencias/{id_evidencia}:
    get:
      tags: [siniestros]
      operationId: descargarEvidencia
      summary: Contenido de una evidencia, con su tipo
      parameters:
        - $ref: "#/components/parameters/IdSiniestro"
        - name: id_evidencia
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: El archivo; `Content-Disposition` trae el nombre original si lo hay
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sesion
      description: Cookie de sesión del canal web, emitida por el BFF al autenticar al cliente.

  parameters:
    IdSiniestro:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdConsentimiento:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdSuscripcion:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NoAutenticado:
      description: |
        No hay una sesión vigente (`sesion_no_vigente`): falta la cookie, venció o su firma no es
        válida. La web lleva al cliente a iniciar sesión de nuevo (WEB-F13, criterio 4).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: El recurso no existe o no pertenece al cliente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflicto:
      description: La operación no aplica al estado actual del recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SolicitudInvalida:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código estable para que el cliente decida qué mostrar
          examples: [consentimiento_no_vigente]
        mensaje:
          type: string
          description: Descripción para diagnóstico; la interfaz no la muestra tal cual

    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, format: password, writeOnly: true }

    Sesion:
      type: object
      required: [cliente]
      properties:
        cliente:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string }
            nombre: { type: string, examples: [Ana] }

    CodigoFinalidad:
      type: string
      enum: [cotizacion, suscripcion, prevencion_fraude]

    Finalidad:
      type: object
      required: [codigo, nombre, descripcion, alcance, vigencia_meses, entidades_origen, version_texto]
      properties:
        codigo: { $ref: "#/components/schemas/CodigoFinalidad" }
        nombre: { type: string }
        descripcion: { type: string }
        alcance:
          type: array
          description: Datos que se consultan bajo esta finalidad
          items: { type: string }
        vigencia_meses: { type: integer, minimum: 1 }
        entidades_origen:
          type: array
          description: Entidades financieras de las que el cliente puede autorizar datos
          items: { $ref: "#/components/schemas/Entidad" }
        version_texto:
          type: string
          description: Versión del texto legal vigente para esta finalidad
          examples: [cotizacion-2026.1]

    Entidad:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string }
        nombre: { type: string }

    EstadoConsentimiento:
      type: string
      enum: [vigente, revocado, vencido]

    SolicitudConsentimiento:
      type: object
      required: [finalidad, entidades_origen, version_texto]
      properties:
        finalidad: { $ref: "#/components/schemas/CodigoFinalidad" }
        entidades_origen:
          type: array
          minItems: 1
          items: { type: string, description: Id de la entidad }
        version_texto:
          type: string
          description: Versión del texto legal que el cliente leyó y aceptó

    Consentimiento:
      type: object
      required: [id, finalidad, entidades_origen, estado, canal, otorgado_en, vence_en, version_texto, por_vencer, dias_para_vencer]
      properties:
        id: { type: string }
        finalidad: { $ref: "#/components/schemas/CodigoFinalidad" }
        entidades_origen:
          type: array
          items: { $ref: "#/components/schemas/Entidad" }
        estado: { $ref: "#/components/schemas/EstadoConsentimiento" }
        canal: { type: string, enum: [web, movil] }
        otorgado_en: { type: string, format: date-time }
        vence_en: { type: string, format: date-time }
        revocado_en:
          type: [string, "null"]
          format: date-time
        version_texto: { type: string }
        por_vencer:
          type: boolean
          description: Vigente y vence en 30 días o menos; la interfaz ofrece renovarlo (WEB-F02, criterio 7)
        dias_para_vencer:
          type: [integer, "null"]
          minimum: 0
          description: Días completos que faltan para vencer; `null` si no está vigente

    EventoConsentimiento:
      type: object
      required: [tipo, ocurrido_en, canal, version_texto]
      properties:
        tipo: { type: string, enum: [otorgado, renovado, revocado, vencido] }
        ocurrido_en: { type: string, format: date-time }
        canal: { type: string, enum: [web, movil, sistema] }
        version_texto: { type: string }

    CodigoProducto:
      type: string
      enum: [auto, hogar, viaje, dispositivos]

    Producto:
      type: object
      required: [codigo, nombre, nombre_corto, descripcion, prima_estandar, valor_asegurado, deducible, coberturas]
      properties:
        codigo: { $ref: "#/components/schemas/CodigoProducto" }
        nombre:
          type: string
          examples: [Seguro de Auto — Plan Full]
        nombre_corto:
          type: string
          examples: [Auto]
        descripcion: { type: string }
        prima_estandar:
          $ref: "#/components/schemas/Dinero"
          description: Prima mensual sin datos de Open Finance ("desde")
        valor_asegurado:
          type: string
          description: Valor asegurado del plan, ya formateado para mostrar
        deducible: { type: string }
        coberturas:
          type: array
          items: { $ref: "#/components/schemas/Cobertura" }

    Cobertura:
      type: object
      required: [nombre, limite]
      properties:
        nombre: { type: string }
        limite: { type: string }

    SolicitudCotizacion:
      type: object
      required: [producto, asegurado, usar_open_finance]
      properties:
        producto: { $ref: "#/components/schemas/CodigoProducto" }
        asegurado: { $ref: "#/components/schemas/DatosAsegurado" }
        usar_open_finance:
          type: boolean
          description: |
            El cliente acepta que se use su perfil financiero en esta cotización. Aun en `true`,
            solo se usa si hay consentimiento vigente para la finalidad `cotizacion`.

    DatosAsegurado:
      type: object
      required: [edad, ciudad]
      properties:
        edad:
          type: integer
          minimum: 18
          maximum: 100
          description: Edad en años cumplidos
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
        valor_asegurado:
          type: [integer, "null"]
          minimum: 0
          description: Valor a asegurar en pesos, si el cliente lo indica

    Dinero:
      type: object
      required: [valor, moneda]
      properties:
        valor:
          type: integer
          description: Monto entero en la unidad mayor de la moneda, sin decimales (pesos para COP)
          examples: [132900]
        moneda:
          type: string
          description: Código ISO 4217 de la moneda
          examples: [COP]

    FactorPrecio:
      type: object
      required: [nombre, efecto]
      properties:
        nombre: { type: string }
        efecto:
          type: number
          description: |
            Variación relativa sobre la prima estándar: `-0.06` la baja un 6 %. El cálculo es
            aditivo: prima_mensual = prima_estandar × (1 + suma de efectos).
          examples: [-0.06]

    Cotizacion:
      type: object
      required:
        - id
        - producto
        - nombre_producto
        - estado
        - prima_mensual
        - prima_estandar
        - ahorro_mensual
        - tipo_tarifa
        - base_perfilamiento
        - motivo_tarifa
        - factores
        - version_regla
        - valor_asegurado
        - deducible
        - coberturas
        - creada_en
        - vigente_hasta
      properties:
        id: { type: string }
        producto: { $ref: "#/components/schemas/CodigoProducto" }
        nombre_producto: { type: string }
        estado:
          type: string
          enum: [vigente, vencida]
          description: Calculado por el servidor al responder
        prima_mensual: { $ref: "#/components/schemas/Dinero" }
        prima_estandar: { $ref: "#/components/schemas/Dinero" }
        ahorro_mensual:
          $ref: "#/components/schemas/Dinero"
          description: prima_estandar − prima_mensual. Nunca negativo; cero con tarifa estándar
        tipo_tarifa:
          type: string
          enum: [personalizada, estandar]
        base_perfilamiento:
          type: string
          enum: [open_finance, open_finance_en_cache, estandar]
          description: |
            Con qué información se calculó la prima. `open_finance_en_cache`: el proveedor estaba
            degradado y se usó el perfil en caché; el precio es igual de válido.
        motivo_tarifa:
          type: [string, "null"]
          enum: [sin_consentimiento, open_finance_desactivado, proveedor_no_disponible, null]
          description: |
            Por qué se usó tarifa estándar; `null` si es personalizada. `open_finance_desactivado`:
            el cliente pidió cotizar sin sus datos financieros. `proveedor_no_disponible`: había
            consentimiento, pero el proveedor de Open Finance no respondió y no había perfil en
            caché (WEB-F01, criterio 3).
        factores:
          type: array
          description: Factores que componen la prima y su efecto ("¿Por qué este precio?")
          items: { $ref: "#/components/schemas/FactorPrecio" }
        version_regla:
          type: string
          description: Versión del modelo de tarificación con que se calculó
          examples: [rating-v3.2]
        valor_asegurado: { type: string }
        deducible: { type: string }
        coberturas:
          type: array
          items: { $ref: "#/components/schemas/Cobertura" }
        creada_en: { type: string, format: date-time }
        vigente_hasta: { type: string, format: date-time }

    SolicitudSuscripcion:
      type: object
      required: [cotizacion_id]
      properties:
        cotizacion_id: { type: string }

    Suscripcion:
      type: object
      required: [id, cotizacion_id, nombre_producto, prima_mensual, estado, aceptada_en, pago]
      properties:
        id: { type: string }
        cotizacion_id: { type: string }
        nombre_producto: { type: string }
        prima_mensual: { $ref: "#/components/schemas/Dinero" }
        estado:
          type: string
          enum: [aceptada, pagada]
          description: "`pagada` cuando la pasarela aprobó el pago"
        aceptada_en: { type: string, format: date-time }
        pago:
          description: Último intento de pago; `null` si aún no se ha pagado
          oneOf:
            - $ref: "#/components/schemas/Pago"
            - type: "null"

    MedioPago:
      type: string
      enum: [tarjeta_credito, pse]

    SolicitudPago:
      type: object
      required: [medio]
      properties:
        medio: { $ref: "#/components/schemas/MedioPago" }

    Pago:
      type: object
      required: [id, estado, medio, monto, referencia, creado_en, reintento]
      properties:
        id: { type: string }
        estado:
          type: string
          enum: [aprobado, rechazado, pendiente]
          description: |
            Respuesta de la pasarela. `rechazado`: no se cobró nada. `pendiente`: el banco aún no
            confirma (típico de PSE); se consulta en `/suscripciones/{id}/pagos/{id_pago}`.
        medio: { $ref: "#/components/schemas/MedioPago" }
        monto: { $ref: "#/components/schemas/Dinero" }
        referencia:
          type: string
          description: Referencia de la transacción en la pasarela
          examples: [TX-2026-77120418]
        creado_en: { type: string, format: date-time }
        reintento:
          type: boolean
          description: "`true` si esta respuesta repite un pago ya procesado con la misma clave"

    EstadoPoliza:
      type: string
      enum: [vigente, vencida, por_iniciar]

    PolizaResumen:
      type: object
      required: [numero, producto, inicio, fin, estado]
      properties:
        numero: { type: string, examples: [POL-2026-000101] }
        producto: { type: string, examples: [auto] }
        inicio: { type: string, format: date, description: Primer día de cobertura }
        fin: { type: string, format: date, description: "Último día de cobertura, incluido" }
        estado: { $ref: "#/components/schemas/EstadoPoliza" }

    TipoEventoSiniestro:
      type: string
      enum:
        - accidente_vehiculo
        - hurto
        - dano_hogar
        - retraso_vuelo
        - equipo_danado_o_perdido
        - cancelacion_viaje
        - otro

    EstadoSiniestro:
      type: string
      description: En el Sprint 2 todo siniestro está `reportado`; el seguimiento llega con WEB-F06.
      enum: [reportado, en_evaluacion, requiere_informacion, aprobado, rechazado, pagado]

    SiguientePaso:
      type: string
      description: Qué le toca al cliente ahora; cada canal lo explica con su propio texto.
      enum: [adjuntar_evidencia, esperar_evaluacion]

    SolicitudSiniestro:
      type: object
      required: [numero_poliza, tipo_evento, ocurrido_el, descripcion]
      properties:
        numero_poliza: { type: string, minLength: 1 }
        tipo_evento: { $ref: "#/components/schemas/TipoEventoSiniestro" }
        ocurrido_el:
          type: string
          format: date
          description: Día del evento; no puede ser futuro
        descripcion: { type: string, minLength: 10, maxLength: 2000 }
        monto_estimado:
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
          description: Opcional; lo que el cliente estima que costó

    Siniestro:
      type: object
      required:
        - id
        - referencia
        - numero_poliza
        - tipo_evento
        - ocurrido_el
        - descripcion
        - monto_estimado
        - estado
        - siguiente_paso
        - canal
        - reportado_en
      properties:
        id: { type: string }
        referencia:
          type: string
          description: Número que ve el cliente, el mismo en los dos canales
          examples: [SIN-2026-000123]
        numero_poliza: { type: string }
        tipo_evento: { $ref: "#/components/schemas/TipoEventoSiniestro" }
        ocurrido_el: { type: string, format: date }
        descripcion: { type: string }
        monto_estimado:
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
        estado: { $ref: "#/components/schemas/EstadoSiniestro" }
        siguiente_paso: { $ref: "#/components/schemas/SiguientePaso" }
        canal: { type: string, enum: [web, movil] }
        reportado_en: { type: string, format: date-time }

    ErrorVigencia:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            vigente_desde:
              type: string
              format: date
              description: Solo con `evento_fuera_de_vigencia`
            vigente_hasta:
              type: string
              format: date
              description: Solo con `evento_fuera_de_vigencia`

    SolicitudEvidencia:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: Foto, video o documento, hasta 10 MB
        tomada_en:
          type: string
          format: date-time
          description: Fecha y hora de la cámara; no puede ser futura
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        lugar:
          type: string
          maxLength: 200
          description: El lugar escrito por el cliente cuando no hay ubicación

    Evidencia:
      type: object
      required: [id, tipo_contenido, tamano, nombre_original, canal, cargada_en]
      properties:
        id: { type: string, examples: [EVI-6f1c2a] }
        tipo_contenido:
          type: string
          enum: [image/jpeg, image/png, image/heic, video/mp4, application/pdf]
        tamano: { type: integer, description: Bytes }
        nombre_original: { type: [string, "null"] }
        canal: { type: string, enum: [web, movil] }
        cargada_en: { type: string, format: date-time }
        tomada_en: { type: [string, "null"], format: date-time }
        latitud: { type: [number, "null"] }
        longitud: { type: [number, "null"] }
        lugar: { type: [string, "null"] }

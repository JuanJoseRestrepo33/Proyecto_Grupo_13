openapi: 3.1.0
info:
  title: Solventa · BFF Móvil
  version: 0.3.0
  description: |
    Contrato entre la app Android y su Backend for Frontend (BFF).

    La app solo habla con este BFF; el BFF orquesta el núcleo. Mientras el BFF no exista, la app
    trabaja contra mocks que implementan este mismo contrato (`mobile/android/app/src/debug`).
    Cubre el Sprint 1:

    - **MOB-F01** · Onboarding y autenticación biométrica: registro, verificación del correo con
      OTP, resultado de la verificación de identidad (KYC/AML simulado) e ingreso con contraseña o
      con biometría.
    - **MOB-F02** · Consentimiento de Open Finance desde la app, con las mismas rutas, formas y
      códigos de error que el contrato web: el consentimiento es del cliente, no del canal. Revocar
      en la app corta el uso del dato en todos los canales.
    - **WEB-F05** · Reporte de siniestros desde la app, con las mismas rutas y códigos que la
      web: el mismo siniestro se ve en los dos canales.

    **Biometría.** Solventa nunca recibe el dato biométrico. Tras el primer ingreso con contraseña,
    la app guarda el `token_refresco` cifrado con una llave del Android Keystore que solo se
    desbloquea con huella o rostro. Ingresar con biometría es, para el BFF, renovar la sesión con
    ese token (`POST /sesiones/renovacion`).

    **Auditoría.** Cada registro, intento de OTP, verificación de identidad e ingreso queda en el
    log de auditoría (ARQ-02); lo escribe el BFF, no la app.

    Convenciones: nombres en español y `snake_case`; fechas en ISO 8601 con zona horaria; los
    errores traen un `codigo` estable que la app traduce a un mensaje propio (nunca muestra
    `mensaje` tal cual).
  license:
    name: Uso académico · MISW4501
    identifier: LicenseRef-Academico
servers:
  - url: /api/v1/movil
    description: Prefijo del BFF móvil
security:
  - token_acceso: []
tags:
  - name: registro
    description: Creación de la cuenta y verificación del correo (MOB-F01)
  - name: sesiones
    description: Ingreso con contraseña y renovación con biometría (MOB-F01)
  - name: identidad
    description: Verificación de identidad KYC/AML (MOB-F01)
  - name: consentimientos
    description: Consentimiento de Open Finance, igual que en la web (MOB-F02)
  - name: siniestros
    description: Reporte de siniestros (WEB-F05)

paths:
  /registros:
    post:
      tags: [registro]
      operationId: crearRegistro
      summary: Crea la cuenta y envía el código de verificación al correo
      description: |
        La cuenta queda en estado `pendiente_verificacion`: sin acceso a funciones que requieran
        identidad verificada (MOB-F01, criterio 1). La contraseña se guarda con hash y sal en el
        núcleo y se emite el evento `ClientRegistered`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRegistro" }
      responses:
        "201":
          description: Cuenta creada; código enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registro" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /registros/{id}/otp/verificacion:
    post:
      tags: [registro]
      operationId: verificarOtp
      summary: Verifica el código enviado al correo y abre la primera sesión
      description: |
        Hay **3 intentos** por código. Al tercer fallo el código queda bloqueado (`otp_bloqueado`)
        y hay que pedir otro; la cuenta no se bloquea.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdRegistro"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudOtp" }
      responses:
        "200":
          description: Correo verificado; sesión abierta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: |
            El código no aplica: `otp_bloqueado` (se agotaron los intentos), `otp_vencido` o
            `registro_ya_verificado`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Código incorrecto (`otp_invalido`); trae los intentos restantes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorOtp" }

  /registros/{id}/otp/reenvio:
    post:
      tags: [registro]
      operationId: reenviarOtp
      summary: Envía un código nuevo e invalida el anterior
      security: []
      parameters:
        - $ref: "#/components/parameters/IdRegistro"
      responses:
        "202":
          description: Código nuevo enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Otp" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "429":
          description: Se pidió un código hace muy poco (`otp_reenvio_prematuro`)
          headers:
            Retry-After:
              description: Segundos que faltan para poder pedir otro código
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sesiones:
    post:
      tags: [sesiones]
      operationId: iniciarSesion
      summary: Ingreso con correo y contraseña
      description: |
        Es también el respaldo de la biometría: si el sensor falla tres veces o no existe, la app
        vuelve a este ingreso, sin bloquear la cuenta (MOB-F01, criterio 5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credenciales" }
      responses:
        "200":
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401":
          description: Correo o contraseña incorrectos (`credenciales_invalidas`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /sesiones/renovacion:
    post:
      tags: [sesiones]
      operationId: renovarSesion
      summary: Renueva la sesión con el token de refresco (ingreso biométrico)
      description: |
        La app desbloquea el `token_refresco` con huella o rostro y lo envía aquí. Cada renovación
        emite un `token_refresco` nuevo e invalida el anterior (rotación).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRenovacion" }
      responses:
        "200":
          description: Sesión renovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401":
          description: |
            Token vencido, revocado o ya usado (`token_refresco_invalido`). La app borra el token
            guardado y pide la contraseña.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sesion:
    get:
      tags: [sesiones]
      operationId: obtenerSesion
      summary: Cliente autenticado
      responses:
        "200":
          description: Cliente de la sesión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /identidad/verificacion:
    get:
      tags: [identidad]
      operationId: obtenerVerificacionIdentidad
      summary: Estado de la última verificación de identidad
      responses:
        "200":
          description: Última verificación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificacionIdentidad" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    post:
      tags: [identidad]
      operationId: solicitarVerificacionIdentidad
      summary: Envía los datos del registro al proveedor KYC/AML
      description: |
        En el Sprint 1 el proveedor está simulado detrás del adaptador `ProveedorKYC` (ARQ-02) y
        valida los datos del registro; la captura de documento y selfie llega después. La respuesta
        puede ser inmediata (`aprobada`, `rechazada`, `en_revision`) o `en_proceso`, y entonces la
        app consulta `GET /identidad/verificacion` en lugar de esperar en una pantalla de carga.
      responses:
        "202":
          description: Verificación recibida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificacionIdentidad" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "409":
          description: La identidad ya está verificada o hay una verificación en curso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /consentimientos/finalidades:
    get:
      tags: [consentimientos]
      operationId: listarFinalidades
      summary: Finalidades que el cliente puede autorizar, cada una por separado
      description: |
        Cada finalidad trae su alcance, su vigencia y las entidades origen de los datos, y la
        versión del texto legal que el cliente acepta al otorgarla (WEB-F02, criterios 1 y 6).
      responses:
        "200":
          description: Catálogo de finalidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finalidad" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /consentimientos:
    get:
      tags: [consentimientos]
      operationId: listarConsentimientos
      summary: Consentimientos del cliente, en cualquier estado
      responses:
        "200":
          description: Consentimientos del cliente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [consentimientos]
      operationId: otorgarConsentimiento
      summary: Otorga el consentimiento para una finalidad
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudConsentimiento" }
      responses:
        "201":
          description: Consentimiento otorgado y vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/SolicitudInvalida" }

  /consentimientos/{id}/revocacion:
    post:
      tags: [consentimientos]
      operationId: revocarConsentimiento
      summary: Revoca un consentimiento vigente
      description: |
        El estado cambia a `revocado` de inmediato. La propagación al resto de la plataforma
        ocurre en ≤ 5 minutos (RC-04); desde ese momento las cotizaciones usan tarifa estándar.
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Consentimiento revocado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /consentimientos/{id}/renovacion:
    post:
      tags: [consentimientos]
      operationId: renovarConsentimiento
      summary: Renueva un consentimiento vigente o vencido sin repetir el flujo completo
      description: |
        La nueva vigencia se cuenta desde la renovación. 409 si está revocado, o si está vencido y ya
        hay otro vigente para la misma finalidad.
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Consentimiento renovado con nueva fecha de expiración
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /consentimientos/{id}/eventos:
    get:
      tags: [consentimientos]
      operationId: listarEventosConsentimiento
      summary: Histórico del consentimiento en orden cronológico
      parameters:
        - $ref: "#/components/parameters/IdConsentimiento"
      responses:
        "200":
          description: Eventos del consentimiento, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventoConsentimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /polizas:
    get:
      tags: [siniestros]
      operationId: listarPolizas
      summary: Pólizas del cliente, para elegir la afectada en el reporte de siniestro
      description: |
        Resumen de cada póliza con su vigencia y estado. La consulta completa, con coberturas,
        deducibles y documento, llega con WEB-F04 y amplía esta misma respuesta.
      responses:
        "200":
          description: Pólizas del cliente, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolizaResumen" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /siniestros:
    get:
      tags: [siniestros]
      operationId: listarSiniestros
      summary: Siniestros del cliente, reportados desde cualquier canal
      responses:
        "200":
          description: Siniestros del cliente, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [siniestros]
      operationId: reportarSiniestro
      summary: Reporta un siniestro sobre una póliza del cliente
      description: |
        El siniestro queda `reportado`, con un número de referencia y el siguiente paso del caso,
        y se ve igual desde la web y desde la app (WEB-F05, criterio 1).

        Cada envío del asistente lleva su `Idempotency-Key`, generada por el cliente. Repetirlo con
        la **misma** clave (doble clic, reintento por red lenta) responde 200 con el mismo
        siniestro y la misma referencia: no se crea otro (criterio 4, P10, P18).

        Una póliza vencida admite el reporte si el evento ocurrió dentro de su vigencia; si no,
        responde 409 `evento_fuera_de_vigencia` con las fechas de la póliza y no queda registro
        (criterio 3).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador único del envío del reporte (UUID v4)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudSiniestro" }
      responses:
        "200":
          description: Reintento de un reporte ya hecho con la misma clave; no se creó otro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "201":
          description: Siniestro reportado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404":
          description: La póliza no existe o no es del cliente (`poliza_no_encontrada`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `evento_fuera_de_vigencia` (trae `vigente_desde` y `vigente_hasta`) o
            `clave_idempotencia_en_uso` (la clave ya se usó para un reporte con otros datos).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorVigencia" }
        "422":
          description: |
            Datos inválidos, `fecha_futura` sobre `ocurrido_el` o `clave_idempotencia_invalida`
            (falta la clave o no es un UUID). Un error por campo en `campos`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /siniestros/{id}:
    get:
      tags: [siniestros]
      operationId: obtenerSiniestro
      summary: Detalle de un siniestro
      parameters:
        - $ref: "#/components/parameters/IdSiniestro"
      responses:
        "200":
          description: Siniestro con su estado y siguiente paso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Siniestro" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

components:
  securitySchemes:
    token_acceso:
      type: http
      scheme: bearer
      description: Token de acceso del canal móvil, emitido al abrir o renovar la sesión.

  parameters:
    IdSiniestro:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdRegistro:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdConsentimiento:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NoAutenticado:
      description: |
        No hay una sesión vigente (`sesion_no_vigente`): falta el token, venció o su firma no es
        válida. Lleva `WWW-Authenticate: Bearer`. La app renueva la sesión con el token de refresco
        o, si no puede, vuelve al inicio de sesión (WEB-F13, criterio 4).
      headers:
        WWW-Authenticate:
          description: Siempre `Bearer`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: El recurso no existe o no pertenece al cliente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflicto:
      description: La operación no aplica al estado actual del recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SolicitudInvalida:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorValidacion" }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código estable para que la app decida qué mostrar
          examples: [correo_ya_registrado]
        mensaje:
          type: string
          description: Descripción para diagnóstico; la interfaz no la muestra tal cual

    ErrorValidacion:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [campos]
          properties:
            campos:
              type: array
              description: Un error por campo, para la validación en línea del formulario
              items:
                type: object
                required: [campo, codigo]
                properties:
                  campo: { type: string, examples: [numero_documento] }
                  codigo: { type: string, examples: [formato_invalido] }

    ErrorOtp:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [intentos_restantes]
          properties:
            intentos_restantes: { type: integer, minimum: 0, maximum: 2 }

    TipoDocumento:
      type: string
      enum: [cedula_ciudadania, cedula_extranjeria, pasaporte]

    EstadoIdentidad:
      type: string
      description: |
        `pendiente_verificacion`: correo verificado, identidad sin verificar; sin acceso a
        funciones que la requieran. `en_revision`: el proveedor pidió revisión manual.
      enum: [pendiente_verificacion, en_revision, verificada, rechazada]

    SolicitudRegistro:
      type: object
      required:
        [nombre_completo, tipo_documento, numero_documento, correo, celular, contrasena, version_terminos]
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120, examples: [Ana María Rojas] }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento:
          type: string
          pattern: "^[A-Za-z0-9]{5,15}$"
          examples: ["1020304050"]
        correo: { type: string, format: email, examples: [ana@ejemplo.co] }
        celular:
          type: string
          description: Celular colombiano, 10 dígitos
          pattern: "^3\\d{9}$"
          examples: ["3001234567"]
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: Al menos una letra y un número
          writeOnly: true
        version_terminos:
          type: string
          description: Versión de los términos y la política de datos que el cliente aceptó
          examples: ["2026-09"]

    Otp:
      type: object
      required: [expira_en, intentos_restantes, reenvio_disponible_en]
      properties:
        expira_en: { type: string, format: date-time }
        intentos_restantes: { type: integer, minimum: 0, maximum: 3 }
        reenvio_disponible_en: { type: string, format: date-time }

    Registro:
      type: object
      required: [id, estado_identidad, otp]
      properties:
        id: { type: string, examples: [REG-2026-000041] }
        estado_identidad: { $ref: "#/components/schemas/EstadoIdentidad" }
        otp: { $ref: "#/components/schemas/Otp" }

    SolicitudOtp:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string, pattern: "^\\d{6}$", examples: ["123456"] }

    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, format: password, writeOnly: true }

    SolicitudRenovacion:
      type: object
      required: [token_refresco]
      properties:
        token_refresco: { type: string, writeOnly: true }

    Cliente:
      type: object
      required: [id, nombre_completo, correo, estado_identidad]
      properties:
        id: { type: string, examples: [CLI-2026-000318] }
        nombre_completo: { type: string, examples: [Ana María Rojas] }
        correo: { type: string, format: email }
        estado_identidad: { $ref: "#/components/schemas/EstadoIdentidad" }

    Sesion:
      type: object
      required: [token_acceso, token_refresco, expira_en, cliente]
      properties:
        token_acceso: { type: string }
        token_refresco:
          type: string
          description: La app lo guarda cifrado con una llave del Keystore ligada a la biometría
        expira_en: { type: string, format: date-time, description: Vencimiento del token de acceso }
        cliente: { $ref: "#/components/schemas/Cliente" }

    VerificacionIdentidad:
      type: object
      required: [id, estado, actualizada_en]
      properties:
        id: { type: string, examples: [KYC-2026-009931] }
        estado:
          type: string
          enum: [en_proceso, aprobada, rechazada, en_revision]
        motivo:
          type: string
          description: |
            Solo si `estado` es `rechazada`. Código estable; la app lo explica en lenguaje claro y
            sin jerga del proveedor (MOB-F01, criterio 7).
          enum: [datos_no_coinciden, documento_no_valido, no_superada]
        reintento_permitido:
          type: boolean
          description: Solo si `estado` es `rechazada`
        actualizada_en: { type: string, format: date-time }

    CodigoFinalidad:
      type: string
      enum: [cotizacion, suscripcion, prevencion_fraude]

    Finalidad:
      type: object
      required: [codigo, nombre, descripcion, alcance, vigencia_meses, entidades_origen, version_texto]
      properties:
        codigo: { $ref: "#/components/schemas/CodigoFinalidad" }
        nombre: { type: string }
        descripcion: { type: string }
        alcance:
          type: array
          description: Datos que se consultan bajo esta finalidad
          items: { type: string }
        vigencia_meses: { type: integer, minimum: 1 }
        entidades_origen:
          type: array
          description: Entidades financieras de las que el cliente puede autorizar datos
          items: { $ref: "#/components/schemas/Entidad" }
        version_texto:
          type: string
          description: Versión del texto legal vigente para esta finalidad
          examples: [cotizacion-2026.1]

    Entidad:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string }
        nombre: { type: string }

    EstadoConsentimiento:
      type: string
      enum: [vigente, revocado, vencido]

    SolicitudConsentimiento:
      type: object
      required: [finalidad, entidades_origen, version_texto]
      properties:
        finalidad: { $ref: "#/components/schemas/CodigoFinalidad" }
        entidades_origen:
          type: array
          minItems: 1
          items: { type: string, description: Id de la entidad }
        version_texto:
          type: string
          description: Versión del texto legal que el cliente leyó y aceptó

    Consentimiento:
      type: object
      required: [id, finalidad, entidades_origen, estado, canal, otorgado_en, vence_en, version_texto, por_vencer, dias_para_vencer]
      properties:
        id: { type: string }
        finalidad: { $ref: "#/components/schemas/CodigoFinalidad" }
        entidades_origen:
          type: array
          items: { $ref: "#/components/schemas/Entidad" }
        estado: { $ref: "#/components/schemas/EstadoConsentimiento" }
        canal: { type: string, enum: [web, movil] }
        otorgado_en: { type: string, format: date-time }
        vence_en: { type: string, format: date-time }
        revocado_en:
          type: [string, "null"]
          format: date-time
        version_texto: { type: string }
        por_vencer:
          type: boolean
          description: Vigente y vence en 30 días o menos; la interfaz ofrece renovarlo (WEB-F02, criterio 7)
        dias_para_vencer:
          type: [integer, "null"]
          minimum: 0
          description: Días completos que faltan para vencer; `null` si no está vigente

    EventoConsentimiento:
      type: object
      required: [tipo, ocurrido_en, canal, version_texto]
      properties:
        tipo: { type: string, enum: [otorgado, renovado, revocado, vencido] }
        ocurrido_en: { type: string, format: date-time }
        canal: { type: string, enum: [web, movil, sistema] }
        version_texto: { type: string }

    Dinero:
      type: object
      required: [valor, moneda]
      properties:
        valor:
          type: integer
          description: Monto entero en la unidad mayor de la moneda, sin decimales (pesos para COP)
          examples: [1500000]
        moneda:
          type: string
          description: Código ISO 4217 de la moneda
          examples: [COP]

    EstadoPoliza:
      type: string
      enum: [vigente, vencida, por_iniciar]

    PolizaResumen:
      type: object
      required: [numero, producto, inicio, fin, estado]
      properties:
        numero: { type: string, examples: [POL-2026-000101] }
        producto: { type: string, examples: [auto] }
        inicio: { type: string, format: date, description: Primer día de cobertura }
        fin: { type: string, format: date, description: "Último día de cobertura, incluido" }
        estado: { $ref: "#/components/schemas/EstadoPoliza" }

    TipoEventoSiniestro:
      type: string
      enum:
        - accidente_vehiculo
        - hurto
        - dano_hogar
        - retraso_vuelo
        - equipo_danado_o_perdido
        - cancelacion_viaje
        - otro

    EstadoSiniestro:
      type: string
      description: En el Sprint 2 todo siniestro está `reportado`; el seguimiento llega con WEB-F06.
      enum: [reportado, en_evaluacion, requiere_informacion, aprobado, rechazado, pagado]

    SiguientePaso:
      type: string
      description: Qué le toca al cliente ahora; cada canal lo explica con su propio texto.
      enum: [adjuntar_evidencia, esperar_evaluacion]

    SolicitudSiniestro:
      type: object
      required: [numero_poliza, tipo_evento, ocurrido_el, descripcion]
      properties:
        numero_poliza: { type: string, minLength: 1 }
        tipo_evento: { $ref: "#/components/schemas/TipoEventoSiniestro" }
        ocurrido_el:
          type: string
          format: date
          description: Día del evento; no puede ser futuro
        descripcion: { type: string, minLength: 10, maxLength: 2000 }
        monto_estimado:
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
          description: Opcional; lo que el cliente estima que costó

    Siniestro:
      type: object
      required:
        - id
        - referencia
        - numero_poliza
        - tipo_evento
        - ocurrido_el
        - descripcion
        - monto_estimado
        - estado
        - siguiente_paso
        - canal
        - reportado_en
      properties:
        id: { type: string }
        referencia:
          type: string
          description: Número que ve el cliente, el mismo en los dos canales
          examples: [SIN-2026-000123]
        numero_poliza: { type: string }
        tipo_evento: { $ref: "#/components/schemas/TipoEventoSiniestro" }
        ocurrido_el: { type: string, format: date }
        descripcion: { type: string }
        monto_estimado:
          oneOf:
            - $ref: "#/components/schemas/Dinero"
            - type: "null"
        estado: { $ref: "#/components/schemas/EstadoSiniestro" }
        siguiente_paso: { $ref: "#/components/schemas/SiguientePaso" }
        canal: { type: string, enum: [web, movil] }
        reportado_en: { type: string, format: date-time }

    ErrorVigencia:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            vigente_desde:
              type: string
              format: date
              description: Solo con `evento_fuera_de_vigencia`
            vigente_hasta:
              type: string
              format: date
              description: Solo con `evento_fuera_de_vigencia`
